modLoader = "javafml"
loaderVersion = "${loader_version_range}"
issueTrackerURL = ""
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "${epicfight_modid}"
    # optional：不装 Epic Fight 也能正常游玩（战斗回落原版）。
    # 代码侧由 Qianxiang.java 的 ModList.isLoaded 守卫保证不触发类加载。
    type = "optional"
    versionRange = "${epicfight_version_range}"
    # BEFORE：让千相的 RegisterCapabilitiesEvent 监听先于 EF 执行，
    # 动态特征→动作 provider 才能优先于 EF 的全物品静态 provider（NeoForge 按注册顺序取首个非 null）。
    ordering = "BEFORE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "travelersbackpack"
    # optional：旅行背包作为工作台自动取料的第二来源；不装则跳过该来源。
    # 代码侧由 MaterialSources 的 ModList.isLoaded 守卫保证不触发类加载。
    type = "optional"
    versionRange = "[10.0.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "refinedstorage"
    # optional：RS2 网络作为工作台自动取料的最末来源；不装则跳过该来源。
    # 代码侧由 MaterialSources 的 ModList.isLoaded 守卫保证不触发类加载。
    type = "optional"
    versionRange = "[2.0.0,)"
    ordering = "NONE"
    side = "BOTH"
