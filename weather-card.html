<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>天气卡片</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    background: radial-gradient(circle at top, #fff7ed, #ffedd5 45%, #fed7aa);
  }
  .card {
    width: min(420px, 92vw); border-radius: 28px; padding: 28px;
    color: #fff; background: linear-gradient(135deg, #f59e0b, #f97316);
    box-shadow: 0 24px 60px rgba(249, 115, 22, .35);
  }
  .city { opacity: .9; letter-spacing: .08em; font-size: 14px; }
  .temp { font-size: 72px; font-weight: 700; line-height: 1; margin: 8px 0 4px; }
  .desc { font-size: 20px; opacity: .95; }
  .meta { display: flex; gap: 16px; margin-top: 22px; font-size: 14px; opacity: .92; }
</style>
</head>
<body>
  <article class="card">
    <div class="city">北京 · BEIJING</div>
    <div class="temp">28°</div>
    <div class="desc">晴朗</div>
    <div class="meta"><span>湿度 45%</span><span>风速 12 km/h</span><span>体感 30°</span></div>
  </article>
</body>
</html>
